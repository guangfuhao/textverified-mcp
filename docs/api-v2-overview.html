<script>
    (() => {
        const styleId = "textverified-rapi-doc-overview-spacing";
        const installOverviewSpacing = () => {
            const rapiDoc = document.querySelector("rapi-doc");
            const root = rapiDoc?.shadowRoot;
            if (!root) {
                return false;
            }

            if (!root.querySelector(`#${styleId}`)) {
                const style = document.createElement("style");
                style.id = styleId;
                style.textContent = `
                    #overview {
                        box-sizing: border-box;
                        padding-left: 80px !important;
                        padding-right: 80px !important;
                    }

                    [part~="section-operations-in-tag"] > #overview {
                        padding-left: 0 !important;
                        padding-right: 0 !important;
                    }

                    @media (max-width: 767px) {
                        #overview,
                        [part~="section-operations-in-tag"] > #overview {
                            padding-left: 8px !important;
                            padding-right: 8px !important;
                        }
                    }
                `;
                root.appendChild(style);
            }

            return true;
        };

        let attempts = 0;
        const tryInstallOverviewSpacing = () => {
            attempts += 1;
            if (!installOverviewSpacing() && attempts < 100) {
                window.setTimeout(tryInstallOverviewSpacing, 50);
            }
        };

        tryInstallOverviewSpacing();
        customElements.whenDefined("rapi-doc").then(tryInstallOverviewSpacing);
    })();
</script>
